name: Publish landing image

on:
  push:
    branches: [main]
    paths:
      - web/out/**
      - web/Dockerfile
      - web/nginx.conf
      - .github/workflows/site-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish landing image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ghcr.io/vladmuresan03/engineering-memory-site:main
            ghcr.io/vladmuresan03/engineering-memory-site:sha-${{ github.sha }}

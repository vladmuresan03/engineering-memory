[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-memory"
version = "0.1.0"
description = "Source-agnostic engineering memory for humans and AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Engineering Memory contributors" }]
keywords = ["engineering-memory", "mcp", "developer-tools", "knowledge-base"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Version Control",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3", "pydantic>=2,<3"]
dev = ["pytest>=8,<10"]

[project.scripts]
engineering-memory = "engineering_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
